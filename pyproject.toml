[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "refrncr"
version = "0.1.0"
description = "Reference data without the enterprise baggage."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "refrncr" }]
dependencies = []

[project.optional-dependencies]
dev = ["pre-commit>=4.0,<5", "pytest>=8.3,<9", "ruff>=0.16,<0.17"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
