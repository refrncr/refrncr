[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "refrncr"
version = "0.1.0"
description = "Reference data without the enterprise baggage."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "refrncr" }]
dependencies = [
    "a2wsgi>=1.10,<2",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "argon2-cffi>=23.1,<26",
    "fastapi>=0.116,<1",
    "flask>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.35,<1",
]

[project.scripts]
refrncr = "refrncr.cli:entrypoint"

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pre-commit>=4.0,<5",
    "pytest>=8.3,<9",
    "ruff>=0.16,<0.17",
    "setuptools>=75",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
refrncr = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
