[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "refrncr"
version = "0.1.0"
description = "Reference data without the enterprise baggage."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "DataMisu" }]
dependencies = [
    "a2wsgi>=1.10,<2",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "argon2-cffi>=23.1,<26",
    "fastapi>=0.141.1,<0.157",
    "pydantic>=2.13.5,<2.15",
    "flask>=3.1,<4",
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.35,<1",
]

[project.scripts]
refrncr = "refrncr.cli:entrypoint"

[project.optional-dependencies]
dev = [
    "build==1.6.1",
    "cyclonedx-bom==7.5.0",
    "httpx==0.28.1",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "pip-tools==7.6.2",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.17.1",
    "setuptools==84.2.1",
    "twine==7.0.0",
]
quality = [
    "bandit>=1.8,<2",
    "pip-audit>=2.9,<3",
    "radon>=6,<7",
    "vulture>=2.14,<3",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
refrncr = [
    "migrations/*.py",
    "migrations/*.mako",
    "migrations/versions/*.py",
    "static/css/*.css",
    "static/css/**/*.css",
    "static/fonts/**/*.woff2",
    "static/js/*.js",
    "static/images/*.svg",
    "static/licenses/*",
    "templates/*.html",
    "templates/**/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "error::DeprecationWarning:refrncr",
    "ignore:.*httpx.*deprecated.*:starlette.exceptions.StarletteDeprecationWarning:fastapi.testclient",
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated.*:DeprecationWarning:starlette.testclient",
    # Python 3.12's sqlite3 adapter warns for SQLAlchemy's supported datetime binding;
    # this is third-party compatibility code and is covered by the database matrix.
    "ignore:The default datetime adapter is deprecated.*:DeprecationWarning:sqlalchemy.engine.default",
]
markers = [
    "postgres: tests that require the configured PostgreSQL test database",
    "slow: tests that are intentionally excluded from the default local run",
]

[tool.coverage.run]
branch = true
source = ["src/refrncr"]
omit = [
    "src/refrncr/migrations/*",
    "*/installed-artifact*/build source/*",
]

[tool.coverage.report]
omit = [
    "src/refrncr/migrations/*",
    "*/installed-artifact*/build source/*",
]
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "A", "BLE", "C90", "DTZ"]
per-file-ignores = { "src/refrncr/web.py" = ["C901"] }

[tool.ruff.lint.mccabe]
max-complexity = 44

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
