repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # Normative product-owner assets are kept byte-for-byte as supplied.
        exclude: ^src/refrncr/static/images/(02-animated-grow-shrink|06-favicon-16px|07-static-logo-256px)\.svg$
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
