repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^src/refrncr/static/(js/swagger-ui-bundle\.js|css/swagger-ui\.css|licenses/.*Swagger-UI.*)$
      - id: end-of-file-fixer
        # Normative product-owner assets are kept byte-for-byte as supplied.
        exclude: ^src/refrncr/static/(images/(favicon|refrncr-loader|refrncr-wordmark-primary)\.svg|js/swagger-ui-bundle\.js|css/swagger-ui\.css|licenses/.*Swagger-UI.*)$
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        # Pinned upstream distribution, verified hash and license in ASSET-SOURCES.md.
        exclude: ^src/refrncr/static/js/swagger-ui-bundle\.js$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: import-linter
        name: import-linter
        entry: python tools/lint_imports.py
        language: python
        additional_dependencies: [import-linter==2.16]
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: python tools/typecheck.py
        language: python
        additional_dependencies: [mypy==2.4.1, "."]
        pass_filenames: false
