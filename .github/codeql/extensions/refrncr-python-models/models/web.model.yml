# Since CodeQL CLI 2.27 this barrier guard no longer suppresses py/url-redirection for the
# login redirect; web.py now rebuilds the target from "/" instead. Kept for older CLIs.
extensions:
  - addsTo:
      pack: codeql/python-all
      extensible: barrierGuardModel
    data:
      - [
          "refrncr.web",
          "Member[is_safe_login_target].Argument[0,target:]",
          "true",
          "url-redirection",
        ]
