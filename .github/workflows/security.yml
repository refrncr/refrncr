name: Supply-chain security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  dependency-and-policy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install security tooling
        run: python -m pip install pip-audit==2.10.1 pip-tools==7.6.2
      - name: Verify reproducible release lock
        run: |
          python tools/compile_release_lock.py
          git diff --exit-code -- requirements/release.txt
      - name: Verify reproducible development lock
        run: |
          python tools/compile_dev_lock.py --fresh
          git diff --exit-code -- requirements/dev.txt
      - name: Prove hash-verified runtime installation
        run: python -m pip install --require-hashes -r requirements/release.txt
      - name: Validate exception register
        run: python tools/supply_chain.py validate-exceptions security/vulnerability-exceptions.json
      - name: Audit locked runtime dependencies (blocking)
        run: >-
          python tools/supply_chain.py audit-runtime requirements/release.txt
          security/vulnerability-exceptions.json runtime-audit.json
      - name: Audit development environment (visible, non-blocking)
        continue-on-error: true
        run: python -m pip_audit --local
      - name: Validate immutable action pins
        run: python tools/supply_chain.py validate-action-pins .
      - name: Set up Go for Gitleaks
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.11"
          cache: false
      - name: Install open-source Gitleaks CLI 8.30.1
        env:
          GOBIN: ${{ runner.temp }}/gitleaks-bin
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan repository and history with redaction
        run: >-
          "${{ runner.temp }}/gitleaks-bin/gitleaks" git . --log-opts="--all"
          --config .gitleaks.toml --redact=100 --no-banner

  gitleaks-safe-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create synthetic fixture without printing it
        run: |
          python -c 'from pathlib import Path; Path("synthetic-secret.txt").write_text("AKIA" + "QWERTYUIOPASDFGH")'
      - name: Set up Go for Gitleaks
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.11"
          cache: false
      - name: Install open-source Gitleaks CLI 8.30.1
        env:
          GOBIN: ${{ runner.temp }}/gitleaks-bin
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Confirm Gitleaks rejects the synthetic fixture with redaction
        run: |
          set +e
          "${{ runner.temp }}/gitleaks-bin/gitleaks" dir . \
            --config .gitleaks.toml --redact=100 --no-banner \
            > "${{ runner.temp }}/gitleaks-fixture.out" 2>&1
          status=$?
          set -e
          test "$status" -eq 1
          ! grep -Fq "$(cat synthetic-secret.txt)" "${{ runner.temp }}/gitleaks-fixture.out"
