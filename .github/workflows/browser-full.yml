name: Full browser acceptance
run-name: Full browser acceptance · ${{ github.ref_name }} · ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
      timezone: Europe/Amsterdam

permissions:
  contents: read
  actions: read

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decision.outputs.run }}
    steps:
      - id: decision
        name: Check for main changes since the previous scheduled run
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous_sha="$(gh api \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/browser-full.yml/runs?event=schedule&status=completed&branch=main&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')"
          if [ -z "$previous_sha" ] || [ "$previous_sha" != "$CURRENT_SHA" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No main changes since the previous completed scheduled run."
          fi

  browser-full:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install locked test tools
        run: |
          python -m pip install -e .
          python -m pip install --require-hashes -r requirements/dev.txt
          npm ci --ignore-scripts --prefix tests/javascript
          node tests/javascript/node_modules/playwright/cli.js install --with-deps chromium
      - name: Run the complete Chromium suite
        run: python tests/run_browser_tests.py --all
