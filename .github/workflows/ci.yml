name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  installed-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build and install wheel with runtime dependencies only
        run: |
          python -m pip wheel --no-deps . --wheel-dir "$RUNNER_TEMP/ref48-dist"
          python -m venv "$RUNNER_TEMP/ref48-runtime"
          "$RUNNER_TEMP/ref48-runtime/bin/python" -m pip install "$RUNNER_TEMP"/ref48-dist/refrncr-*.whl
      - name: Check wheel license metadata
        run: >-
          python tests/verify_distribution_license.py
          "$RUNNER_TEMP"/ref48-dist/refrncr-*.whl LICENSE
      - name: Check installed Excel XML protection
        run: '"$RUNNER_TEMP/ref48-runtime/bin/python" -I tests/installed_xml_smoke.py'

  browser-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install locked test tools
        run: |
          python -m pip install -e .
          python -m pip install --require-hashes -r requirements/dev.txt
          npm ci --ignore-scripts --prefix tests/javascript
          node tests/javascript/node_modules/playwright/cli.js install --with-deps chromium
      - name: Test core Chromium journeys
        run: python tests/run_browser_tests.py --core

  browser-full-if-browser-changed:
    name: browser-full-if-browser-changed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: browser-changes
        name: Detect browser-test infrastructure changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_paths="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed_paths"
          if printf '%s\n' "$changed_paths" | grep -Eq '^(\.github/workflows/(browser-full|ci)\.yml|pyproject\.toml|requirements/dev\.txt|tests/run_browser_tests\.py|tests/browser_[^/]+_app\.py|tests/javascript/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Browser-test infrastructure changed; running the complete Chromium suite." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No browser-test infrastructure changed; the complete Chromium suite is not required." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Set up Python
        if: steps.browser-changes.outputs.run == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up Node
        if: steps.browser-changes.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install locked test tools
        if: steps.browser-changes.outputs.run == 'true'
        run: |
          python -m pip install -e .
          python -m pip install --require-hashes -r requirements/dev.txt
          npm ci --ignore-scripts --prefix tests/javascript
          node tests/javascript/node_modules/playwright/cli.js install --with-deps chromium
      - name: Test complete Chromium suite
        if: steps.browser-changes.outputs.run == 'true'
        run: python tests/run_browser_tests.py --all

  test-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COVERAGE_FILE: coverage-sqlite.dat
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install --require-hashes -r requirements/dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Collect SQLite cases
        run: python -m pytest --collect-only -q -m 'not postgres'

      - name: Test SQLite suite with coverage
        run: >-
          python -m pytest -n auto -m 'not postgres and not slow'
          --durations=30 --timeout=300 --timeout-method=thread -q
          --cov --cov-report= --cov-fail-under=0

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-sqlite
          path: coverage-sqlite.dat
          if-no-files-found: error
          retention-days: 1

  test-sqlite-slow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install --require-hashes -r requirements/dev.txt

      - name: Collect SQLite slow cases
        run: python -m pytest --collect-only -q -m 'not postgres and slow'

      - name: Test SQLite slow cases
        run: >-
          python -m pytest --run-slow -n auto -m 'not postgres and slow'
          --durations=20 --timeout=300 --timeout-method=thread -q --no-cov

  test-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REFRNCR_TEST_POSTGRES_URL: postgresql+psycopg://refrncr:refrncr@localhost:5432/refrncr_test
      COVERAGE_FILE: coverage-postgres.dat

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: refrncr_test
          POSTGRES_USER: refrncr
          POSTGRES_PASSWORD: refrncr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U refrncr -d refrncr_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install PostgreSQL 16 client tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install --require-hashes -r requirements/dev.txt

      - name: Collect PostgreSQL cases
        run: python -m pytest --collect-only -q -m postgres

      - name: Test PostgreSQL suite with coverage
        run: >-
          python -m pytest -n auto -m 'postgres and not slow'
          --durations=30 --timeout=300 --timeout-method=thread -q
          --cov --cov-report= --cov-fail-under=0

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-postgres
          path: coverage-postgres.dat
          if-no-files-found: error
          retention-days: 1

  test-postgres-slow:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REFRNCR_TEST_POSTGRES_URL: postgresql+psycopg://refrncr:refrncr@localhost:5432/refrncr_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: refrncr_test
          POSTGRES_USER: refrncr
          POSTGRES_PASSWORD: refrncr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U refrncr -d refrncr_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install PostgreSQL 16 client tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install --require-hashes -r requirements/dev.txt

      - name: Collect PostgreSQL slow cases
        run: python -m pytest --collect-only -q -m 'postgres and slow'

      - name: Test PostgreSQL slow cases
        run: >-
          python -m pytest --run-slow -n auto -m 'postgres and slow'
          --durations=20 --timeout=300 --timeout-method=thread -q --no-cov

  coverage:
    needs: [test-sqlite, test-postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/dev.txt

      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Report combined coverage
        run: |
          python -m coverage combine coverage-sqlite.dat coverage-postgres.dat
          python -m coverage report --fail-under=90
