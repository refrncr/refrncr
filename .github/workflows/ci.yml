name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-csp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install locked test tools
        run: |
          python -m pip install -e .
          python -m pip install --require-hashes -r requirements/dev.txt
          npm ci --ignore-scripts --prefix tests/javascript
          node tests/javascript/node_modules/playwright/cli.js install --with-deps chromium
      - name: Test enforced browser CSP
        run: python tests/run_browser_tests.py web_csp

  test-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COVERAGE_FILE: coverage-sqlite.dat
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install --require-hashes -r requirements/dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Collect SQLite cases
        run: python -m pytest --collect-only -q -m 'not postgres'

      - name: Test SQLite suite with coverage
        run: >-
          python -m pytest -n auto -m 'not postgres and not slow'
          --durations=30 --timeout=300 --timeout-method=thread -q
          --cov --cov-report= --cov-fail-under=0

      - name: Test SQLite slow cases without coverage
        run: >-
          python -m pytest --run-slow -n auto -m 'not postgres and slow'
          --durations=20 --timeout=300 --timeout-method=thread -q --no-cov

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-sqlite
          path: coverage-sqlite.dat
          if-no-files-found: error
          retention-days: 1

  test-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REFRNCR_TEST_POSTGRES_URL: postgresql+psycopg://refrncr:refrncr@localhost:5432/refrncr_test
      COVERAGE_FILE: coverage-postgres.dat

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: refrncr_test
          POSTGRES_USER: refrncr
          POSTGRES_PASSWORD: refrncr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U refrncr -d refrncr_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install PostgreSQL 16 client tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install --require-hashes -r requirements/dev.txt

      - name: Collect PostgreSQL cases
        run: python -m pytest --collect-only -q -m postgres

      - name: Test PostgreSQL suite with coverage
        run: >-
          python -m pytest -n auto -m 'postgres and not slow'
          --durations=30 --timeout=300 --timeout-method=thread -q
          --cov --cov-report= --cov-fail-under=0

      - name: Test PostgreSQL slow cases without coverage
        run: >-
          python -m pytest --run-slow -n auto -m 'postgres and slow'
          --durations=20 --timeout=300 --timeout-method=thread -q --no-cov

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-postgres
          path: coverage-postgres.dat
          if-no-files-found: error
          retention-days: 1

  coverage:
    needs: [test-sqlite, test-postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/dev.txt

      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Report combined coverage
        run: |
          python -m coverage combine coverage-sqlite.dat coverage-postgres.dat
          python -m coverage report --fail-under=90
