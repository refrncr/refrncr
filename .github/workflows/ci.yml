name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REFRNCR_TEST_POSTGRES_URL: postgresql+psycopg://refrncr:refrncr@localhost:5432/refrncr_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: refrncr_test
          POSTGRES_USER: refrncr
          POSTGRES_PASSWORD: refrncr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U refrncr -d refrncr_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install --require-hashes -r requirements/dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Test SQLite suite
        run: |
          python -m coverage erase
          python -m pytest --collect-only -q -m 'not postgres'
          python -m pytest --run-slow -n auto --durations=50 --timeout=300 --timeout-method=thread -m 'not postgres' -q --cov --cov-append --cov-report= --cov-fail-under=0

      - name: Test PostgreSQL suite
        run: |
          python -m pytest --collect-only -q -m postgres
          python -m pytest --run-slow -n auto --durations=50 --timeout=300 --timeout-method=thread -m postgres -q --cov --cov-append --cov-report= --cov-fail-under=0

      - name: Report combined coverage
        run: python -m coverage report --fail-under=90
