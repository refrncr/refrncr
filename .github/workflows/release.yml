name: Controlled release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate immutable release source and version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$RELEASE_TAG" = "v$VERSION"
      - name: Require successful CI for the released commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          check_runs="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs")"
          for check in \
            installed-runtime \
            browser-core \
            test-sqlite \
            test-sqlite-slow \
            test-postgres \
            test-postgres-slow \
            coverage \
            dependency-and-policy \
            gitleaks-safe-fixture \
            analyze-and-gate
          do
            test "$(jq --arg name "$check" \
              '[.check_runs[] | select(.name == $name and .conclusion == "success")] | length' \
              <<<"$check_runs")" -ge 1
          done
      - name: Install locked runtime graph and release tools
        run: |
          python -m pip install --require-hashes -r requirements/release.txt
          python -m pip install build==1.6.1 cyclonedx-bom==7.5.0 pip-audit==2.10.1 pipx==1.7.1 twine==7.0.0
      - name: Gate runtime vulnerabilities
        run: >-
          python tools/supply_chain.py audit-runtime requirements/release.txt
          security/vulnerability-exceptions.json runtime-audit.json
      - name: Build wheel and source distribution once
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          python -m build --outdir release-artifacts/distributions
          python tools/normalize_sdist.py \
            release-artifacts/distributions/*.tar.gz "$SOURCE_DATE_EPOCH"
      - name: Validate the exact artifacts
        run: |
          python -m twine check release-artifacts/distributions/*
          python -m pip install --no-deps release-artifacts/distributions/*.whl
          python -m pip check
          refrncr --help
          cd release-artifacts
          sha256sum distributions/*.whl distributions/*.tar.gz > SHA256SUMS
      - name: Prove a clean pipx install and packaged startup
        env:
          PIPX_HOME: ${{ runner.temp }}/release-pipx-home
          PIPX_BIN_DIR: ${{ runner.temp }}/release-pipx-bin
        run: |
          python -m pipx install release-artifacts/distributions/*.whl
          database="$RUNNER_TEMP/refrncr-release-smoke.db"
          log="$RUNNER_TEMP/refrncr-release-smoke.log"
          "$PIPX_BIN_DIR/refrncr" start --database-path "$database" --port 8765 >"$log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill -INT "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          python tools/release_smoke.py http://127.0.0.1:8765
          test -s "$database"
      - name: Prove upgrade from the preceding public release for stable versions
        run: >-
          python tools/release_upgrade.py
          release-artifacts/distributions/*.whl "$RUNNER_TEMP/release-upgrade"
      - name: Generate CycloneDX JSON SBOM from locked graph
        run: >-
          cyclonedx-py requirements requirements/release.txt
          --output-format JSON --output-file release-artifacts/refrncr.cdx.json
      - name: Add the publication verifier to the validated job bundle
        run: cp tools/release_publication.py release-artifacts/release_publication.py
      - name: Upload the single validated artifact set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-release-artifacts
          path: release-artifacts/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-production
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download the validated artifact set
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-release-artifacts
          path: release-artifacts
      - name: Verify transferred artifact hashes
        working-directory: release-artifacts
        run: sha256sum --check SHA256SUMS
      - name: Attest exact wheel and source distribution
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-artifacts/distributions/*.whl
            release-artifacts/distributions/*.tar.gz
      - name: Attach the validated artifact set to the existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          repository="${{ github.repository }}"
          mkdir -p "$RUNNER_TEMP/existing-release-assets"
          missing=()
          for asset in \
            release-artifacts/SHA256SUMS \
            release-artifacts/refrncr.cdx.json \
            release-artifacts/distributions/*
          do
            name="$(basename "$asset")"
            if gh release download "$tag" --repo "$repository" \
              --pattern "$name" --dir "$RUNNER_TEMP/existing-release-assets" 2>/dev/null
            then
              cmp --silent "$asset" "$RUNNER_TEMP/existing-release-assets/$name" || {
                echo "Existing release asset differs: $name" >&2
                exit 1
              }
              echo "Existing release asset is identical: $name"
            else
              missing+=("$asset")
            fi
          done
          if ((${#missing[@]})); then
            gh release upload "$tag" --repo "$repository" "${missing[@]}"
          fi
      - id: pypi
        name: Check for an identical existing PyPI publication
        run: >-
          python release-artifacts/release_publication.py
          release-artifacts/distributions "$GITHUB_OUTPUT"
      - name: Publish exact distributions through PyPI Trusted Publishing
        if: steps.pypi.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: release-artifacts/distributions/
