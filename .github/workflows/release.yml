name: Controlled release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate immutable release source and version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$RELEASE_TAG" = "v$VERSION"
      - name: Require successful CI for the released commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          check_runs="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs")"
          for check in \
            installed-runtime \
            browser-core \
            test-sqlite \
            test-sqlite-slow \
            test-postgres \
            test-postgres-slow \
            coverage \
            dependency-and-policy \
            gitleaks-safe-fixture \
            analyze-and-gate
          do
            test "$(jq --arg name "$check" \
              '[.check_runs[] | select(.name == $name and .conclusion == "success")] | length' \
              <<<"$check_runs")" -ge 1
          done
      - name: Install locked runtime graph and release tools
        run: |
          python -m pip install --require-hashes -r requirements/release.txt
          python -m pip install build==1.6.1 cyclonedx-bom==7.5.0 pip-audit==2.10.1 twine==7.0.0
      - name: Gate runtime vulnerabilities
        run: >-
          python tools/supply_chain.py audit-runtime requirements/release.txt
          security/vulnerability-exceptions.json runtime-audit.json
      - name: Build wheel and source distribution once
        run: python -m build --outdir release-artifacts/distributions
      - name: Validate the exact artifacts
        run: |
          python -m twine check release-artifacts/distributions/*
          python -m pip install --no-deps release-artifacts/distributions/*.whl
          python -m pip check
          refrncr --help
          sha256sum release-artifacts/distributions/*.whl release-artifacts/distributions/*.tar.gz > release-artifacts/SHA256SUMS
      - name: Generate CycloneDX JSON SBOM from locked graph
        run: >-
          cyclonedx-py requirements requirements/release.txt
          --output-format JSON --output-file release-artifacts/refrncr.cdx.json
      - name: Upload the single validated artifact set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-release-artifacts
          path: release-artifacts/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-production
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download the validated artifact set
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-release-artifacts
          path: release-artifacts
      - name: Attest exact wheel and source distribution
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-artifacts/distributions/*.whl
            release-artifacts/distributions/*.tar.gz
      - name: Attach the validated artifact set to the existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          release-artifacts/SHA256SUMS release-artifacts/refrncr.cdx.json
          release-artifacts/distributions/*
      - name: Publish exact distributions through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: release-artifacts/distributions/
