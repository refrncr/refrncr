{% extends "base.html" %}
{% block content %}
  {% include "pages/datasets/_breadcrumbs.html" %}<h1>Import records</h1>
  {% if error %}<p class='alert alert-error' role='alert'>{{ error }}</p>{% endif %}
  <form class='form' method='post' enctype='multipart/form-data'><label>CSV or Excel file <input type='file' name='file' accept='.csv,.xlsx' required></label><input type='hidden' name='csrf_token' value='{{ current_csrf }}'><button class='button button-primary' type='submit'>Upload file</button></form>
{% endblock %}
