{% from 'components.html' import feedback %}
{% from 'pages/datasets/_team_choice.html' import team_choice %}
  {{ feedback(error, id="dataset-edit-error", focus=true) }}
  <form id='dataset-ownership-form' class='form dataset-edit-form' novalidate method='post' action='{{ url_for("update_dataset", key=dataset.key) }}'>
    <input type='hidden' name='csrf_token' value='{{ current_csrf }}'>
    <input type='hidden' name='edit_section' value='ownership'>
    <input type='hidden' name='settings_return_context' value='{{ settings_return_context }}'>
    {{ team_choice(teams, selected_team_id) }}
    <input type='hidden' name='expected_owner_team_id' value='{{ expected_owner_team_id }}'>
    <p class='help-text'>Only administrators can change dataset ownership.</p>
    <div class='form-actions'>
      <button class='button button-primary' type='submit'>Save changes</button>
      <a class='button button-secondary' href='{{ configuration_url }}#dataset-details-heading'>Cancel</a>
    </div>
  </form>
