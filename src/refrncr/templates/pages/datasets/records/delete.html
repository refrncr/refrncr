{% extends "base.html" %}
{% block content %}
  <nav><a href='{{ url_for("dataset_records_view", key=dataset.key) }}'>Records</a></nav><h1>Delete record</h1>{% if error %}<p class='alert alert-error' role='alert'>{{ error }}</p>{% endif %}<p>Record identifier: {{ identifier }}</p><p>This deletion cannot be undone.</p>
  <form method='post'><input type='hidden' name='csrf_token' value='{{ current_csrf }}'><input type='hidden' name='expected_revision' value='{{ record.revision }}'><label><input type='checkbox' name='confirm' value='yes'> I confirm permanent deletion</label><button class='button-danger'>Delete record</button></form>
{% endblock %}
