{% macro record_form_fields(fields, prefix, values=none, initial_focus=false) -%}
  {% for field in fields %}
    <div class='form-field'>
      <label for='{{ prefix }}-{{ field.key }}'>{{ field.name }}{% if field.is_required %} <span class='required-mark' aria-hidden='true'>*</span>{% endif %}</label>
      {% if field.data_type == 'boolean' %}
        <select id='{{ prefix }}-{{ field.key }}' name='{{ field.key }}'{% if field.is_required %} required{% endif %}{% if initial_focus and loop.first %} autofocus data-initial-focus{% endif %}>
          <option value=''>Choose a value</option>
          <option value='true'{% if values is not none and values.get(field.key) == true %} selected{% endif %}>Yes</option>
          <option value='false'{% if values is not none and values.get(field.key) == false %} selected{% endif %}>No</option>
        </select>
      {% else %}
        <input id='{{ prefix }}-{{ field.key }}' name='{{ field.key }}' type='{{ "date" if field.data_type == "date" else "text" }}'{% if values is not none %} value='{{ values.get(field.key)|record_value_text(field.data_type) }}'{% endif %}{% if field.is_required %} required{% endif %}{% if initial_focus and loop.first %} autofocus data-initial-focus{% endif %}>
      {% endif %}
    </div>
  {% endfor %}
{%- endmacro %}
