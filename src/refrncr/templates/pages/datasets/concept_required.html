{% extends "base.html" %}
{% from "components/concept.html" import new_concept with context %}
{% block content %}
<h1>Concept unavailable</h1>
<p class='alert alert-info'>{{ error }}</p>
<div class='page-actions'>
<a class='button button-secondary' href='{{ url_for("dataset_versions_view", key=key) }}'>Versions</a>

{% if not already_active %}{{ new_concept(key) }}{% endif %}
</div>
{% endblock %}
