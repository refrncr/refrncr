{% macro create_user_fields() -%}
  <div class='form-field'><label for='new-user-email'>Email address</label><input id='new-user-email' name='email' type='email' required autofocus data-initial-focus></div>
  <div class='form-field'><label for='new-user-name'>Name</label><input id='new-user-name' name='display_name' required></div>
  <div class='form-field'><label for='new-user-password'>Password</label><input id='new-user-password' name='password' type='password' required></div>
  <div class='form-field'><label for='new-user-role'>Role</label><select id='new-user-role' name='role'><option value='user'>User</option><option value='admin'>Administrator</option></select></div>
{%- endmacro %}

{% macro edit_user_fields(user) -%}
  <div class='form-field'><label for='edit-user-name-{{ user.id }}'>Name</label><input id='edit-user-name-{{ user.id }}' value='{{ user.display_name }}' disabled></div>
  <div class='form-field'><label for='edit-user-email-{{ user.id }}'>Email address</label><input id='edit-user-email-{{ user.id }}' name='email' type='email' value='{{ user.email }}' required></div>
  <div class='form-field'><label for='edit-user-role-{{ user.id }}'>Role</label><input id='edit-user-role-{{ user.id }}' value='{{ "Administrator" if user.role == "admin" else "User" }}' disabled></div>
{%- endmacro %}
