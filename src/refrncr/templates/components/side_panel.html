{% macro side_panel(panel_id, title, title_id, description=none, description_id=none, has_modes=false, entity=none, auto_open=none) -%}
  <dialog class='side-panel' id='{{ panel_id }}' data-side-panel data-modal-side-panel aria-labelledby='{{ title_id }}'{% if description and description_id %} aria-describedby='{{ description_id }}'{% endif %}{% if has_modes %} data-panel-modes{% endif %}{% if entity %} data-panel-entity='{{ entity }}'{% endif %}{% if auto_open %} data-auto-open='{{ auto_open }}'{% endif %}>
    <div class='side-panel-layout'>
      <header class='side-panel-header'>
        <div>
          <h2 id='{{ title_id }}'>{{ title }}</h2>
          {% if description %}<p{% if description_id %} id='{{ description_id }}'{% endif %}{% if has_modes %} data-panel-subtitle data-default-text='{{ description }}'{% endif %}>{{ description }}</p>{% endif %}
        </div>
        <button class='side-panel-close' type='button' data-dialog-close aria-label='Close panel'>×</button>
      </header>
      {{ caller() }}
    </div>
  </dialog>
{%- endmacro %}
