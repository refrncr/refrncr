{% from "components/icons.html" import download_icon %}

{% macro export_action(dataset, version_state, may_export) %}
  {% if may_export %}<details class='export-menu'>
    <summary class='button button-secondary'>{{ download_icon() }}Export</summary>
    <div class='export-menu-options' aria-label='Export format'>
      {% if dataset.kind == 'hierarchy' %}
      <a href='{{ url_for("export_dataset_records", key=dataset.key, version_id=version_state.version.id if version_state else none, concept=true if not version_state else none, format="csv_zip") }}'>CSV</a>
      {% else %}<a href='{{ url_for("export_dataset_records", key=dataset.key, version_id=version_state.version.id if version_state else none, concept=true if not version_state else none, format="csv") }}'>CSV</a>{% endif %}
      <a href='{{ url_for("export_dataset_records", key=dataset.key, version_id=version_state.version.id if version_state else none, concept=true if not version_state else none, format="xlsx") }}'>Excel</a>
      <a href='{{ url_for("export_dataset_records", key=dataset.key, version_id=version_state.version.id if version_state else none, concept=true if not version_state else none, format="json") }}'>JSON</a>
    </div>
  </details>{% endif %}
{% endmacro %}
