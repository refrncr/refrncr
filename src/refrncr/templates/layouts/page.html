{% macro page_header(title, description='') -%}
  <header class="page-header">
    <div>
      <h1>{{ title }}</h1>
      {% if description %}<p>{{ description }}</p>{% endif %}
    </div>
  </header>
{%- endmacro %}

{% macro page_context(title, metadata) -%}
  <div class="page-context">
    {{ caller() }}
    <h1 class="page-title">{{ title }}</h1>
    {{ metadata }}
  </div>
{%- endmacro %}
